# Used by `cargo about generate about.hbs --all-features > THIRD_PARTY_LICENSES.html`.
accepted = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "PolyForm-Noncommercial-1.0.0",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "MPL-2.0",
    "BSL-1.0",
    "OFL-1.1",
    "0BSD",
    "CDLA-Permissive-2.0",
    "LGPL-2.1",
    "LGPL-3.0",
]
# The jade-rs crates themselves are PolyForm Noncommercial 1.0.0 (see LICENSE).
ignore-build-dependencies = false
ignore-dev-dependencies = true

# Upstream (mythrnr/wmf-rs, MIT) omits the `license` field and ships LICENSE at the repo root only.
[wmf-core]
accepted = ["MIT"]

[wmf-core.clarify]
license = "MIT"

[[wmf-core.clarify.git]]
path = "LICENSE"
checksum = "5b55b824fe7c2babf4a6e8745dffa8f41282c8304a293861f48eeddd022c5a2c"

