[package]
name = "jade-docx-extract"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lib]
doctest = false

[dependencies]
quick-xml = "0.41"
zip = { version = "9.0", default-features = false, features = ["deflate"] }
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }

[dev-dependencies]
insta = { version = "1.38", features = ["yaml"] }