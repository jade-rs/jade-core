[package]
name = "jade-docx-crdt"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
jade-crdt = { path = "../jade-crdt" }
jade-docx-reader = { path = "../jade-docx-reader" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
getrandom = { version = "0.2", features = ["js"] }
zip = { version = "9.0", default-features = false, features = ["deflate"] }

[dev-dependencies]
proptest = "1.6"
