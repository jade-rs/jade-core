[package]
name = "jade-pptx-writer"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
jade-opc = { path = "../jade-opc" }
jade-pptx-reader = { path = "../jade-pptx-reader" }
jade-pptx-layout = { path = "../jade-pptx-layout" }
quick-xml = "0.39"
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
unicode-segmentation = "1.10"
uuid = { version = "1.26", features = ["v4", "js"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
sha2 = "0.10"
png = "0.18"

[dev-dependencies]
zip = { version = "8.0", default-features = false, features = ["deflate"] }
proptest = "1.6"
jade-pptx-render = { path = "../jade-pptx-render" }
jade-painter = { path = "../jade-painter" }
