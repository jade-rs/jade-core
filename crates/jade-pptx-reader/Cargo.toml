[package]
name = "jade-pptx-reader"
version = "0.1.0"
edition = "2021"
license = "PolyForm-Noncommercial-1.0.0"

[dependencies]
jade-opc = { path = "../jade-opc" }
quick-xml = "0.39"
serde = { version = "1.0", features = ["derive", "rc"] }
thiserror = "2.0"

[dev-dependencies]
proptest = "1.6"
zip = { version = "8.0", default-features = false, features = ["deflate"] }
