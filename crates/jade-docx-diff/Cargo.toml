[package]
name = "jade-docx-diff"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Structure-aware DOCX comparison: paragraph, table and row alignment, then a character-level diff"

[lib]
name = "jade_docx_diff"
doctest = false

[[bin]]
name = "jade-docx-diff"
path = "src/main.rs"

[dependencies]
anyhow = "1"
jade-diff-align = { path = "../jade-diff-align" }
jade-docx-extract = { path = "../jade-docx-extract" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-normalization = "0.1"

[dev-dependencies]
jade-docx-extract = { path = "../jade-docx-extract" }
zip = { version = "9.0", default-features = false, features = ["deflate"] }
