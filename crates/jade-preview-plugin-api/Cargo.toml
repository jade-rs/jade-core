[package]
name = "jade-preview-plugin-api"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Shared ABI + helper macros for authoring jade decoration plugins as WebAssembly guest modules."

[lib]
# Library only — guest crates that use this should set their own `cdylib` target.
doctest = false

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
