[package]
name = "jade-xlsx-editor"
version = "0.1.0"
edition = "2021"
license = "PolyForm-Noncommercial-1.0.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
jade-canvas-painter = { path = "../jade-canvas-painter" }
jade-painter = { path = "../jade-painter" }
jade-xlsx-headless-api = { path = "../jade-xlsx-headless-api" }
jade-xlsx-headless-editor = { path = "../jade-xlsx-headless-editor" }
serde_json = "1.0"
jade-xlsx-layout = { path = "../jade-xlsx-layout" }
jade-xlsx-reader = { path = "../jade-xlsx-reader" }
jade-xlsx-render = { path = "../jade-xlsx-render" }
console_error_panic_hook = "0.1"
js-sys = "0.3"
wasm-bindgen = "0.2"

[dependencies.web-sys]
version = "0.3"
features = [
  "CanvasRenderingContext2d",
  "CssStyleDeclaration",
  "HtmlCanvasElement",
  "ImageBitmap",
  "HtmlElement",
  "TextMetrics",
]
