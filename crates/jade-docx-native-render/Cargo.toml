[workspace]

[package]
name = "jade-docx-native-render"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

# Deliberately outside the workspace, for the same reason as
# `jade-skia-painter`: it pulls in `skia-safe`, and the workspace CI builds
# with `--all-features`, which would make every run pay for that.

[dependencies]
jade-docx-editor = { path = "../jade-docx-editor", features = ["opentype-math"] }
jade-painter = { path = "../jade-painter" }
jade-skia-painter = { path = "../jade-skia-painter" }
jade-docx-layout = { path = "../jade-docx-layout", features = ["native-shaping", "opentype-math"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = "0.3"
futures = "0.3"
jade-docx-headless-api = { path = "../jade-docx-headless-api" }
jade-selection = { path = "../jade-selection" }
jade-opc = { path = "../jade-opc" }
jade-docx-reader = { path = "../jade-docx-reader" }
# The installed fonts a document names: found by any of their names, read
# only when a document asks for them.
fontdb = "0.23"
ttf-parser = { version = "0.25.1", default-features = false, features = ["std"] }

[dev-dependencies]
# Only so a failing render test can write the page out as a PNG to look at.
image = { version = "0.25", default-features = false, features = ["png"] }
lopdf = "=0.39.0"
zip = { version = "9.0", default-features = false, features = ["deflate"] }
serde_json = "1"
sha2 = "0.10"
