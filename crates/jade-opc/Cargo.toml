[package]
name = "jade-opc"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
quick-xml = "0.39"
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
sha2 = "0.10"
# 読み取りパスワード: ECMA-376 Agile Encryption in an OLE compound file.
aes = "0.8"
base64 = "0.22"
cfb = "0.7"
zip = { version = "8.0", default-features = false, features = ["deflate"] }
