[package]
name = "jade-docx-reader"
version = "0.1.0"
edition = "2021"
license = "PolyForm-Noncommercial-1.0.0"

[dependencies]
jade-opc = { path = "../jade-opc" }
serde = { version = "1.0", features = ["derive", "rc"] }
quick-xml = "0.39"
encoding_rs = "0.8"
thiserror = "2.0"
sha2 = "0.10"
zip = { version = "8.0", default-features = false, features = ["deflate"] }

[dev-dependencies]
serde_json = "1.0"
proptest = "1.6"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "props_bench"
harness = false
