[package]
name = "jade-pptx-editor"
version = "0.1.0"
edition = "2021"
license = "PolyForm-Noncommercial-1.0.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
jade-canvas-painter = { path = "../jade-canvas-painter" }
jade-painter = { path = "../jade-painter" }
jade-pptx-headless-cli = { path = "../jade-pptx-headless-cli" }
jade-pptx-layout = { path = "../jade-pptx-layout" }
jade-pptx-reader = { path = "../jade-pptx-reader" }
jade-pptx-writer = { path = "../jade-pptx-writer" }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
jade-pptx-render = { path = "../jade-pptx-render" }
console_error_panic_hook = "0.1"
js-sys = "0.3"
wasm-bindgen = "0.2"

[dependencies.web-sys]
version = "0.3"
features = [
  "CanvasRenderingContext2d",
  "CssStyleDeclaration",
  "HtmlCanvasElement",
  "HtmlElement",
  "ImageBitmap",
  "TextMetrics",
]
