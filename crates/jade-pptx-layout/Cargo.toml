[package]
name = "jade-pptx-layout"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
jade-pptx-reader = { path = "../jade-pptx-reader" }
jade-text-layout = { path = "../jade-text-layout" }
jade-picture-effects = { path = "../jade-picture-effects", default-features = false }
serde = { version = "1.0", features = ["derive"] }
unicode-segmentation = "1.10"
unicode-script = "0.5"

[dev-dependencies]
jade-opc = { path = "../jade-opc" }
jade-xlsx-reader = { path = "../jade-xlsx-reader" }
jade-xlsx-writer = { path = "../jade-xlsx-writer" }
proptest = "1.6"
