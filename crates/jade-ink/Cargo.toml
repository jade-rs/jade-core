[package]
name = "jade-ink"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Office ink (InkML) shared by the Word and PowerPoint engines: reading and writing the parts, painting strokes, and a picture of them."

[dependencies]
jade-painter = { path = "../jade-painter" }
quick-xml = "0.41"
serde = { version = "1.0", features = ["derive", "rc"] }
png = "0.17"
