[package]
name = "jade-xlsx-reader"
version = "0.1.0"
edition = "2021"
license = "PolyForm-Noncommercial-1.0.0"

[dependencies]
sha2 = "0.10"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive", "rc"] }
jade-opc = { path = "../jade-opc" }
