[package]
name = "jade-xlsx-headless-editor"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
jade-opc = { path = "../jade-opc" }
jade-xlsx-headless-api = { path = "../jade-xlsx-headless-api" }
jade-xlsx-calc = { path = "../jade-xlsx-calc" }
jade-xlsx-layout = { path = "../jade-xlsx-layout" }
jade-xlsx-reader = { path = "../jade-xlsx-reader" }
jade-xlsx-writer = { path = "../jade-xlsx-writer" }
thiserror = "2.0"
icu_collator = "=2.3.1"
icu_locale = { version = "=2.3.1", default-features = false }

[dev-dependencies]
ironcalc_base = { package = "jade-xlsx-calc-engine", version = "0.1.0", path = "../../third_party/ironcalc-base" }
jade-opc = { path = "../jade-opc" }
libc = "0.2"
proptest = "1.6"
serde_json = "1.0"
