[package]
name = "jade-docx-editor"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# jade-docx-convert's PDF reflow reads PDFs through lopdf, whose random
# numbers come from the JavaScript host in the browser build.
lopdf = { version = "=0.39.0", default-features = false, features = ["wasm_js"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde = { version = "1.0", features = ["derive", "rc"] }
serde-wasm-bindgen = "0.6"
zip = { version = "8.0", default-features = false, features = ["deflate"] }
thiserror = "2.0"
console_error_panic_hook = "0.1"
unicode-segmentation = "1.10"
unicode-script = "0.5"
base64 = "0.22"
sha2 = "0.10"
cfb = "0.7"
bumpalo = { version = "3", features = ["collections"] }
png = "0.17"
resvg = { version = "0.45.1", default-features = false }
futures = "0.3"
flate2 = "1"
encoding_rs = "0.8"
jade-selection = { path = "../jade-selection" }
jade-opc = { path = "../jade-opc" }
quick-xml = "0.39"
# Pictures drawn with their colour adjustments and soft edges applied, and
# the picture tools' pixel work (background removal).
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
emf-core = { git = "https://github.com/mythrnr/emf-rs.git", tag = "0.0.8", package = "emf-core", default-features = false, features = ["svg"] }
wmf-core = { git = "https://github.com/mythrnr/wmf-rs.git", tag = "0.0.24", package = "wmf-core", default-features = false, features = ["svg"] }
indexmap = "2.7"
rustc-hash = "2.1"
jade-docx-writer = { path = "../jade-docx-writer" }
jade-docx-reader = { path = "../jade-docx-reader" }
jade-docx-convert = { path = "../jade-docx-convert", features = ["pdf"] }
jade-docx-diff = { path = "../jade-docx-diff" }
jade-docx-merge = { path = "../jade-docx-merge" }
hypher = { version = "0.1", default-features = false, features = ["english"] }
getrandom = { version = "0.2", features = ["js"] }
jade-doc-reader = { path = "../jade-doc-reader" }
jade-doc-writer = { path = "../jade-doc-writer" }
# Word charts drawn by the chart layout the spreadsheet renderer uses.
jade-xlsx-reader = { path = "../jade-xlsx-reader" }
jade-xlsx-layout = { path = "../jade-xlsx-layout" }
jade-docx-annotations = { path = "../jade-docx-annotations" }
jade-docx-layout = { path = "../jade-docx-layout" }
jade-pptx-layout = { path = "../jade-pptx-layout" }
jade-canvas-painter = { path = "../jade-canvas-painter" }
jade-painter = { path = "../jade-painter" }
jade-docx-headless-api = { path = "../jade-docx-headless-api" }
jade-preview-plugin-api = { path = "../jade-preview-plugin-api" }
serde_json = "1.0"
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry"], optional = true }

[features]
default = []
opentype-math = ["jade-docx-layout/opentype-math"]
otel = ["tracing", "tracing-subscriber"]

[dependencies.web-sys]
version = "0.3"
features = [
  "console",
  "Document",
  "Element",
  "HtmlElement",
  "Node",
  "Window",
  "Blob",
  "BlobPropertyBag",
  "File",
  "FileReader",
  "Url",
  "HtmlCanvasElement",
  "CanvasRenderingContext2d",
  "OffscreenCanvas",
  "ImageBitmap",
  "ImageBitmapRenderingContext",
  "OffscreenCanvasRenderingContext2d",
  "TextMetrics",
  "ImageData",
  "HtmlImageElement",
  "CssStyleDeclaration",
  "DomRect",
  "EventTarget",
  "KeyboardEvent",
  "PointerEvent",
  "CompositionEvent",
  "HtmlTextAreaElement",
  "InputEvent",
  "WorkerGlobalScope",
  "DedicatedWorkerGlobalScope",
]

[dev-dependencies]
futures = "0.3"
proptest = "1.6"

[[example]]
name = "math_font_plan"
required-features = ["opentype-math"]
