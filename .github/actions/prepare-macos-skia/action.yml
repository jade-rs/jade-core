name: Prepare pinned Mac Skia binaries
description: Verify the official Skia archive before Rust consumes it
runs:
  using: composite
  steps:
    - shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        test "$(uname -m)" = arm64
        archive="$RUNNER_TEMP/skia-0.87.0-aarch64.tar.gz"
        for attempt in 1 2 3; do
          if gh api repos/rust-skia/skia-binaries/releases/assets/266267944 --header 'Accept: application/octet-stream' > "$archive"; then
            break
          fi
          [ "$attempt" -lt 3 ] || exit 1
          sleep "$attempt"
        done
        printf '%s  %s\n' f15a955e61503f77d57d3cfee7362aabe93ea934d6580065a96de5519f2e7019 "$archive" | shasum -a 256 --check
        echo "SKIA_BINARIES_URL=file://$archive" >> "$GITHUB_ENV"
