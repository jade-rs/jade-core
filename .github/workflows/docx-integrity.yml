name: DOCX edit integrity

on:
  workflow_dispatch:
  schedule:
    - cron: '23 18 * * *'
  pull_request:
    paths:
      - 'crates/jade-docx-*/**'
      - 'crates/jade-opc/**'
      - 'crates/jade-selection/**'
      - 'fuzz/**'
      - 'tools/docx-validator/**'
      - 'public/fixtures/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/docx-integrity.yml'

permissions:
  contents: read

jobs:
  properties:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build independent Microsoft OOXML validator
        run: |
          dotnet restore tools/docx-validator --locked-mode
          dotnet build tools/docx-validator --no-restore --configuration Release
          dotnet tools/docx-validator/bin/Release/net8.0/DocxValidator.dll --self-test
      - name: Model-based edit and history properties
        env:
          PROPTEST_CASES: '512'
          DOCX_SCHEMA_CORPUS: ${{ runner.temp }}/docx-schema-corpus
        run: cargo test --locked -p jade-docx-headless-editor --test edit_integrity
      - name: Validate every saved property and structural history state against OOXML
        run: dotnet tools/docx-validator/bin/Release/net8.0/DocxValidator.dll "${{ runner.temp }}/docx-schema-corpus"
      - name: Related DOCX regression tests
        run: cargo test --locked -p jade-docx-reader -p jade-docx-writer -p jade-docx-document-core -p jade-docx-headless-editor --lib
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: docx-proptest-regressions
          path: crates/jade-docx-headless-editor/tests/*.proptest-regressions
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: docx-schema-corpus
          path: ${{ runner.temp }}/docx-schema-corpus
          if-no-files-found: ignore

  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build independent OOXML validator
        run: |
          dotnet restore tools/docx-validator --locked-mode
          dotnet build tools/docx-validator --no-restore --configuration Release
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz -> target
      - run: cargo install cargo-fuzz --locked --version 0.13.2
      - name: Seed each fixture and edit kind
        run: |
          mkdir -p fuzz/corpus/edit_docx
          cp fuzz/seeds/edit_docx/* fuzz/corpus/edit_docx/
      - name: Fuzz mixed edits on real DOCX fixtures
        env:
          DOCX_SCHEMA_CORPUS: ${{ runner.temp }}/docx-fuzz-schema-corpus
        run: cargo +nightly fuzz run edit_docx -- -max_total_time=300 -max_len=385 -timeout=60
      - name: Validate every successful fuzz save against OOXML
        run: dotnet tools/docx-validator/bin/Release/net8.0/DocxValidator.dll "${{ runner.temp }}/docx-fuzz-schema-corpus"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: docx-fuzz-corpus-and-crashes
          path: |
            fuzz/artifacts/
            fuzz/corpus/
            ${{ runner.temp }}/docx-fuzz-schema-corpus
          if-no-files-found: ignore
