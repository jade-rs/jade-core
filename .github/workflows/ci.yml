name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # 03:00 JST: retain corpus coverage outside the PR feedback loop.
    - cron: '0 18 * * *'
  workflow_dispatch:
    inputs:
      pdf_parity_full:
        description: Compare every PDF fixture across all densities, themes and edit states
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  crdt-worker-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Install pinned Lean toolchain manager
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/elan-crdt"
          cd "$RUNNER_TEMP/elan-crdt"
          for attempt in 1 2 3; do
            if gh api repos/leanprover/elan/releases/assets/529114798 --header 'Accept: application/octet-stream' > elan.tar.gz; then
              break
            fi
            [ "$attempt" -lt 3 ] || exit 1
            sleep "$attempt"
          done
          echo '42b94d4244e8353142c456ec0e4ca6528fd898a6c604d4059f494e706e431f63  elan.tar.gz' | sha256sum --check
          tar -xzf elan.tar.gz
          ./elan-init -y --default-toolchain none --no-modify-path
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Check capture proofs (pinned by lean-toolchain)
        working-directory: crates/jade-docx-crdt/formal
        run: |
          lean Capture.lean
          lean Session.lean
      - name: Worker PBT against the executable proved model
        env:
          JADE_LEAN_ORACLE: '1'
        run: node --experimental-strip-types --test crates/jade-docx-crdt/worker/*.test.ts

  lint:
    runs-on: ubuntu-latest
    # A stalled dependency install used to burn the full six-hour default.
    timeout-minutes: 45
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Cargo fmt
        run: cargo fmt --all -- --check

      - name: Cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Cargo check
        run: cargo check --all --all-features

      - name: Cargo check the file writers the browser build uses (wasm32)
        # `.doc` and password-protected packages are written in the browser
        # too; their compound-file writer must not need a clock there.
        run: |
          rustup target add wasm32-unknown-unknown
          cargo check --target wasm32-unknown-unknown -p jade-doc-writer -p jade-opc -p jade-xlsx-calc

  test:
    runs-on: ubuntu-latest
    # Workspace tests can take 37 minutes before the mandatory 2,034-document
    # edit/export/reopen audit. Keep dependency setup bounded separately.
    timeout-minutes: 60
    env:
      # Keep hundreds of test binaries/link jobs within hosted-runner disk and memory.
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Verify Word oracle release corpus input bytes
        run: python3 -m unittest discover -s scripts -p test_word_oracle_release_corpus.py

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        timeout-minutes: 10

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        timeout-minutes: 10

      - name: Cargo property tests (headless API)
        run: cargo test -p jade-docx-editor --all-features property_

      - name: Cargo test
        timeout-minutes: 45
        run: |
          cargo test --all --all-features -- \
            --skip text_extract::tests::extracts_expected_first_wrapped_line_from_yokohama_mini \
            --skip text_extract::tests::line_layout_exposes_index_text_page_and_geometry

      - name: Install Node.js for CRDT worker tests
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: CRDT worker capture barriers
        run: node --experimental-strip-types --test crates/jade-docx-crdt/worker/*.test.ts

      - name: Verify native macOS workflow contract
        run: ruby tests/ci/native_macos_workflow_test.rb

      - name: Verify macOS Skia acquisition
        run: python3 -m unittest discover -s scripts/ci -p test_prepare_macos_skia.py

      - name: Verify Word inline-space probe inputs
        run: python3 -m unittest discover -s tests/word-oracle/mac-probes-20261019/generators -p test_object_spaces_probe.py

      - name: Audit edited DOCX fixture corpus
        timeout-minutes: 15
        run: |
          python3 -m unittest discover -s scripts -p test_audit_mac_release_corpus.py
          python3 scripts/audit-mac-release-corpus.py

  word-mac-browser-coordinates:
    name: Mac Word browser coordinate match
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/word-mac-browser
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install Word reference verification dependencies
        run: python -m pip install -r scripts/word-oracle/requirements-borders.txt
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: |
            . -> target/word-mac-browser
          cache-bin: true
      - name: Install WASM build tools
        run: |
          rustup show
          cargo install --locked wasm-bindgen-cli --version 0.2.114
          llvm_bin="$(brew --prefix llvm)/bin"
          if [ ! -x "$llvm_bin/clang" ] || [ ! -x "$llvm_bin/llvm-ar" ]; then
            brew install llvm
          fi
          echo "CC_wasm32_unknown_unknown=$llvm_bin/clang" >> "$GITHUB_ENV"
          echo "CXX_wasm32_unknown_unknown=$llvm_bin/clang++" >> "$GITHUB_ENV"
          echo "AR_wasm32_unknown_unknown=$llvm_bin/llvm-ar" >> "$GITHUB_ENV"
          echo "RANLIB_wasm32_unknown_unknown=$llvm_bin/llvm-ranlib" >> "$GITHUB_ENV"
      - name: Build the DOCX renderer
        env:
          CFLAGS_wasm32_unknown_unknown: -g0
        run: make wasm-docx
      - name: Install the comparison browser
        run: |
          npm install --prefix "$RUNNER_TEMP/word-coordinate-tools" --no-audit --no-fund playwright@1.64.0
          "$RUNNER_TEMP/word-coordinate-tools/node_modules/.bin/playwright" install chromium
      - name: Compare synthetic DOCX layouts with Word coordinates
        run: |
          python3 -m unittest discover -s scripts/word-oracle -p test_platform_coordinates.py
          python3 scripts/word-oracle/check_platform_coordinates.py
          export NODE_PATH="$RUNNER_TEMP/word-coordinate-tools/node_modules"
          node --test scripts/ci/word_coordinate_matching.test.mjs
          node scripts/ci/check_mac_word_coordinates.mjs
      - name: Upload browser coordinate differences
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mac-word-browser-coordinate-differences
          path: target/word-mac-browser-differences.json
          if-no-files-found: ignore

  # Run the coordinate gate independently: a lint/PDF dependency failure in
  # native-macos must not prevent the Mac coordinate comparison from running.
  word-mac-coordinates:
    name: Mac Word coordinate match
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      RUSTUP_TOOLCHAIN: stable
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/word-mac-coordinates
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install Word reference verification dependencies
        run: python -m pip install -r scripts/word-oracle/requirements-borders.txt
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: |
            . -> target/word-mac-coordinates
      - name: Prepare verified macOS Skia binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/prepare_macos_skia.py --output "$RUNNER_TEMP/jade-skia-0.87.0-macos.tar.gz"
      - name: Assert independent Mac and Windows original references
        run: |
          python3 -m unittest discover -s scripts/word-oracle -p test_platform_coordinates.py
          python3 scripts/word-oracle/check_platform_coordinates.py
      - name: Compare Mac drawing coordinates with committed Word references
        run: cargo test --manifest-path crates/jade-docx-native-render/Cargo.toml --locked --test word_mac_coordinates -- --test-threads=1
      - name: Upload coordinate differences
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mac-word-coordinate-differences
          path: crates/jade-docx-native-render/target/word-mac-coordinates
          if-no-files-found: ignore

  windows-word-baselines:
    name: Windows Word baselines by version
    runs-on: windows-latest
    defaults:
      run:
        # GitHub runs explicit bash with -e -o pipefail. An earlier Python
        # assertion must fail the step even if a later command would pass.
        shell: bash
    # All versioned originals are mandatory; the expanded corpus also runs
    # border, print and editing gates after the four-plane font comparisons.
    timeout-minutes: 105
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/windows-word-baselines
      RUSTUP_TOOLCHAIN: stable
      SKIA_BINARIES_URL: https://github.com/rust-skia/skia-binaries/releases/download/0.87.0/skia-binaries-e551f334ad5cbdf43abf-x86_64-pc-windows-msvc-pdf-svg-textlayout-vulkan-webpd-webpe.tar.gz
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The actual synthetic-merge tree and its PR parent are both bound
          # into the downloadable renderer's provenance record.
          fetch-depth: 2
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: . -> target/windows-word-baselines
      # Original Word PDF font programs permit absolute XY and paint checks
      # without Office on the runner. Live installed-font checks also run on
      # the capture machine via jade-office/scripts/test-windows-word.ps1.
      - name: Setup drawing-reference verifier Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install pinned vector border verifier
        run: python -m pip install -r scripts/word-oracle/requirements-borders.txt
      - name: Verify drawing-origin extraction and rejection cases
        run: python -m unittest discover -s scripts/word-oracle -p test_windows_emf.py
      - name: Verify unpromoted original Windows Word observations
        run: |
          python -m unittest discover -s scripts/word-oracle -p test_windows_observations.py
          python -m unittest discover -s scripts/word-oracle -p test_windows_aptos_family_probes.py
          python -m unittest discover -s scripts/word-oracle -p test_windows_aptos_style_probes.py
          python -m unittest discover -s scripts/word-oracle -p test_windows_aptos_subset_probes.py
          python -m unittest discover -s scripts/word-oracle -p test_windows_aptos_wrap_probes.py
          python -m unittest discover -s scripts/word-oracle -p test_windows_column_table_probes.py
          python -m unittest discover -s scripts/word-oracle -p test_windows_minimum_line_probes.py
          python -m unittest discover -s scripts/word-oracle -p test_windows_percentage_table_probes.py
          python -m unittest discover -s scripts/word-oracle -p test_windows_aptos_size_probes.py
          python -m unittest discover -s scripts/word-oracle -p test_windows_aptos_nominal_probes.py
          python -m unittest discover -s scripts/word-oracle -p test_windows_printer_toggle_probes.py
          python -m unittest discover -s scripts/word-oracle -p test_windows_positive_kerning_probes.py
          python -m unittest discover -s scripts/word-oracle -p test_windows_xps.py
          python -m unittest discover -s scripts/word-oracle -p test_windows_color_span_probes.py
          python -m unittest discover -s scripts/word-oracle -p test_windows_word_boundary_probes.py
          python -m unittest discover -s scripts/word-oracle -p test_windows_y_length_probes.py
          python -m unittest discover -s scripts/word-oracle -p test_windows_y_pdf_context_probes.py
          python -m unittest discover -s scripts/word-oracle -p test_windows_hard_break_space_probes.py
          python -m unittest discover -s scripts/word-oracle -p test_windows_legacy_justification_probes.py
          python -m unittest discover -s scripts/word-oracle -p test_windows_xps_fonts.py
          python -m unittest discover -s scripts/word-oracle -p test_windows_space_pair_probes.py
          python -m unittest discover -s scripts/word-oracle -p test_windows_mixed_face_probes.py
          python -m unittest discover -s scripts/word-oracle -p test_windows_font_slot_spacing_probes.py
          python -m unittest discover -s scripts/word-oracle -p test_windows_explicit_hyphen_probes.py
          python -m unittest discover -s scripts/word-oracle -p test_windows_top_bottom_probes.py
          python -m unittest discover -s scripts/word-oracle -p test_windows_pdf_segment_probes.py
          python -m unittest discover -s scripts/word-oracle -p test_windows_header_table_probes.py
          python -m unittest discover -s scripts/word-oracle -p test_windows_table_style_probes.py
          python -m unittest discover -s scripts/word-oracle -p test_windows_heading_break_probes.py
          python -m unittest discover -s scripts/word-oracle -p test_windows_table_row_probes.py
          python -m unittest discover -s scripts/word-oracle -p test_windows_missing_font_probes.py
          python -m unittest discover -s scripts/word-oracle -p test_windows_graphic_text_probes.py
          python -m unittest discover -s scripts/word-oracle -p test_windows_japanese_graphic_text_probes.py
          python -m unittest discover -s scripts/word-oracle -p test_windows_justification_probes.py
          python -m unittest discover -s scripts/word-oracle -p test_windows_justification_size_probes.py
          python -m unittest discover -s scripts/word-oracle -p test_windows_justification_width_probes.py
          python -m unittest discover -s scripts/word-oracle -p test_windows_justification_threshold_probes.py
          python -m unittest discover -s scripts/word-oracle -p test_windows_manual_size_threshold_probes.py
          python -m unittest discover -s scripts/word-oracle -p test_windows_small_slack_probes.py
          python -m unittest discover -s scripts/word-oracle -p test_windows_fallback_spacing_probes.py
          python -m unittest discover -s scripts/word-oracle -p test_windows_balanced_font_slot_probes.py
          python -m unittest discover -s scripts/word-oracle -p test_windows_cross_font_slot_probes.py
          python -m unittest discover -s scripts/word-oracle -p test_windows_calibri_fallback_style_probes.py
          python -m unittest discover -s scripts/word-oracle -p test_windows_calibri_autooff_probes.py
          python -m unittest discover -s scripts/word-oracle -p test_windows_balanced_space_letter_probes.py
          python -m unittest discover -s scripts/word-oracle -p test_windows_plain_space_letter_probes.py
          python scripts/word-oracle/check_windows_observations.py
      - name: Reconstruct registered origins from original Word drawing files
        run: python scripts/word-oracle/extract_windows_emf.py --verify-index tests/word-oracle/windows/index.json
      - name: Verify border displacement and missing-paint rejection cases
        run: python -m unittest discover -s scripts/word-oracle -p test_windows_borders.py
      - name: Build vector drawing probe
        id: windows-coordinate-renderer
        run: cargo build --manifest-path crates/jade-docx-native-render/Cargo.toml --locked --example word_coordinates
      - name: Record Windows coordinate renderer provenance
        id: windows-coordinate-renderer-provenance
        env:
          WORD_RENDERER_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python -m unittest discover -s scripts/ci -p test_word_renderer_build.py
          python scripts/ci/record_word_renderer_build.py --executable target/windows-word-baselines/debug/examples/word_coordinates.exe --output target/windows-word-baselines/word-renderer-build.json
      - name: Upload verified Windows coordinate renderer
        if: ${{ always() && steps.windows-coordinate-renderer-provenance.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-word-coordinate-renderer
          path: |
            target/windows-word-baselines/debug/examples/word_coordinates.exe
            target/windows-word-baselines/word-renderer-build.json
          if-no-files-found: error
          retention-days: 14
      - name: Assert native shaping platform boundaries
        run: cargo test --manifest-path crates/jade-docx-layout/Cargo.toml --locked --features native-shaping --lib
      - name: Assert Office cached-font discovery against original Word output
        run: |
          python -m unittest discover -s scripts/word-oracle -p test_windows_office_cloud_fonts.py
          python scripts/word-oracle/check_windows_office_cloud_fonts.py --native-executable target/windows-word-baselines/debug/examples/word_coordinates.exe
      - name: Assert shared Mac originals against Windows Word version expectations
        run: |
          python -m unittest discover -s scripts/word-oracle -p test_platform_coordinates.py
          python -m unittest discover -s scripts/word-oracle -p test_windows_float_lookahead_probes.py
          python -m unittest discover -s scripts/word-oracle -p test_windows_calibri_title_tracking_probes.py
          python -m unittest discover -s scripts/word-oracle -p test_windows_ms_auto_spacing_probes.py
          python scripts/word-oracle/check_platform_coordinates.py --native-executable target/windows-word-baselines/debug/examples/word_coordinates.exe
      - name: Reconstruct versioned Windows script metrics from original Word output
        run: |
          python -m unittest discover -s scripts/word-oracle -p test_windows_script_metrics.py
          python scripts/word-oracle/check_windows_script_metrics.py
      - name: Assert Windows font coordinates with original Word embedded fonts
        run: |
          python -m unittest discover -s scripts/word-oracle -p test_windows_font_coordinates.py
          python -m unittest discover -s scripts/word-oracle -p test_windows_numeric_spacing_probes.py
          python -m unittest discover -s scripts/word-oracle -p test_windows_courier_grid_probes.py
          python -m unittest discover -s scripts/word-oracle -p test_windows_paragraph_backgrounds.py
          python -m unittest discover -s scripts/word-oracle -p test_windows_dot_leaders.py
          python -m unittest discover -s scripts/word-oracle -p test_windows_calibri_probes.py
          python scripts/word-oracle/check_windows_font_coordinates.py --native-executable target/windows-word-baselines/debug/examples/word_coordinates.exe
      - name: Assert versioned Windows Word manual-break XPS origins
        run: python scripts/word-oracle/check_windows_hard_break_spaces.py --compare-rendered-fonts target/windows-font-coordinates
      - name: Assert versioned Windows Word mixed-face justification and source font metrics
        run: python scripts/word-oracle/check_windows_mixed_face.py --compare-rendered-fonts target/windows-font-coordinates
      - name: Assert versioned Windows Word mixed-script font-slot spacing
        run: python scripts/word-oracle/check_windows_font_slot_spacing.py --compare-rendered-fonts target/windows-font-coordinates
      - name: Assert versioned Windows Word space-pair kerning XPS origins
        run: python scripts/word-oracle/check_windows_space_pair.py --compare-rendered-fonts target/windows-font-coordinates
      - name: Assert versioned Windows Word legacy justification and pending text
        run: python scripts/word-oracle/check_windows_legacy_justification.py --native-executable target/windows-word-baselines/debug/examples/word_coordinates.exe --compare-rendered-fonts target/windows-font-coordinates
      - name: Assert source-form Windows hyphen paint against original Word fonts
        run: |
          python -m unittest discover -s scripts/word-oracle -p test_windows_mixed_hyphen_probes.py
          python -m unittest discover -s scripts/word-oracle -p test_windows_hyphen_paint.py
          python scripts/word-oracle/check_windows_hyphen_paint.py --native-executable target/windows-word-baselines/debug/examples/word_coordinates.exe
      - name: Assert Windows Aptos nominal screen origins and validated PDF origins
        run: python scripts/word-oracle/check_windows_aptos_nominal.py --native-executable target/windows-word-baselines/debug/examples/word_coordinates.exe
      - name: Upload Windows nominal coordinate differences
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-aptos-nominal-differences
          path: target/windows-aptos-nominal
          if-no-files-found: ignore
      - name: Assert Windows positive kerning screen and validated PDF origins
        run: python scripts/word-oracle/check_windows_positive_kerning.py --native-executable target/windows-word-baselines/debug/examples/word_coordinates.exe
      - name: Upload Windows positive kerning coordinate differences
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-positive-kerning-differences
          path: target/windows-positive-kerning
          if-no-files-found: ignore
      - name: Assert Windows Arial and top-bottom geometry against original Word screen and PDF
        run: |
          python -m unittest discover -s scripts/word-oracle -p test_windows_top_bottom_clearance.py
          python scripts/word-oracle/check_windows_top_bottom_clearance.py --native-executable target/windows-word-baselines/debug/examples/word_coordinates.exe
      - name: Upload Windows top-bottom coordinate differences
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-top-bottom-coordinate-differences
          path: target/windows-top-bottom-clearance
          if-no-files-found: ignore
      - name: Assert independent Windows Word screen and vector PDF origins
        run: |
          python -m unittest discover -s scripts/word-oracle -p test_windows_output_contexts.py
          python scripts/word-oracle/check_windows_output_contexts.py --native-executable target/windows-word-baselines/debug/examples/word_coordinates.exe
      - name: Assert Windows table screen, PDF and vector-rule coordinates
        run: |
          python -m unittest discover -s scripts/word-oracle -p test_windows_column_table_gate.py
          python scripts/word-oracle/check_windows_column_tables.py --native-executable target/windows-word-baselines/debug/examples/word_coordinates.exe
      - name: Assert Windows minimum-line coordinates and preserve screen geometry
        run: |
          python -m unittest discover -s scripts/word-oracle -p test_windows_minimum_line_gate.py
          python scripts/word-oracle/check_windows_minimum_lines.py --native-executable target/windows-word-baselines/debug/examples/word_coordinates.exe
      - name: Assert Windows percentage-table coordinates and preserve screen geometry
        run: |
          python -m unittest discover -s scripts/word-oracle -p test_windows_percentage_table_gate.py
          python scripts/word-oracle/check_windows_percentage_tables.py --native-executable target/windows-word-baselines/debug/examples/word_coordinates.exe
      - name: Assert Windows Aptos screen origins and validated PDF origins
        run: |
          python -m unittest discover -s scripts/word-oracle -p test_windows_aptos_size_gate.py
          python scripts/word-oracle/check_windows_aptos_sizes.py --native-executable target/windows-word-baselines/debug/examples/word_coordinates.exe
      - name: Assert independent versioned Windows Word XPS print origins
        run: python scripts/word-oracle/check_windows_xps.py --compare-rendered
      - name: Upload Windows Word XPS coordinate differences
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-word-xps-differences
          path: target/windows-word-xps
          if-no-files-found: ignore
      - name: Assert versioned Windows Word color-span screen and print origins
        run: python scripts/word-oracle/check_windows_color_spans.py --native-executable target/windows-word-baselines/debug/examples/word_coordinates.exe
      - name: Upload Windows color-span coordinate differences
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-color-span-differences
          path: target/windows-color-spans
          if-no-files-found: ignore
      - name: Assert versioned Windows Word word-boundary screen and print origins
        run: python scripts/word-oracle/check_windows_word_boundaries.py --native-executable target/windows-word-baselines/debug/examples/word_coordinates.exe
      - name: Upload Windows word-boundary coordinate differences
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-word-boundary-differences
          path: target/windows-word-boundaries
          if-no-files-found: ignore
      - name: Assert versioned Windows Word repeated-y screen and print origins
        run: python scripts/word-oracle/check_windows_y_lengths.py --native-executable target/windows-word-baselines/debug/examples/word_coordinates.exe
      - name: Upload Windows repeated-y coordinate differences
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-y-length-differences
          path: target/windows-y-lengths
          if-no-files-found: ignore
      - name: Assert versioned Windows Word paragraph-order screen and print origins
        run: python scripts/word-oracle/check_windows_y_pdf_context.py --native-executable target/windows-word-baselines/debug/examples/word_coordinates.exe
      - name: Upload Windows paragraph-order coordinate differences
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-y-pdf-context-differences
          path: |
            target/windows-y-pdf-context
            !target/windows-y-pdf-context/**/fonts/*.ttf
            !target/windows-y-pdf-context/**/fonts/*.otf
            !target/windows-y-pdf-context/**/fonts/*.ttc
            !target/windows-y-pdf-context/.font-cache/**
          if-no-files-found: ignore
      - name: Assert versioned Windows text effects and absolute outline geometry
        run: |
          python -m unittest discover -s scripts/word-oracle -p test_windows_graphic_text.py
          python -m unittest discover -s scripts/word-oracle -p test_windows_actualtext_aliases.py
          python scripts/word-oracle/check_windows_graphic_text.py --native-executable target/windows-word-baselines/debug/examples/word_coordinates.exe
      - name: Assert note-rule paint against versioned original Word PDF and EMF
        run: |
          python -m unittest discover -s scripts/word-oracle -p test_windows_note_rules.py
          python scripts/word-oracle/check_windows_note_rules.py --native-directory target/windows-font-coordinates
      - name: Assert Windows Word print coordinates and preserve screen disagreements
        run: |
          python -m unittest discover -s scripts/word-oracle -p test_windows_print_coordinates.py
          python scripts/word-oracle/check_windows_print_coordinates.py --native-executable target/windows-word-baselines/debug/examples/word_coordinates.exe
      - name: Compare Windows table borders with every registered Word version
        run: python scripts/word-oracle/compare_windows_borders.py --index tests/word-oracle/windows/index.json --native-executable target/windows-word-baselines/debug/examples/word_coordinates.exe --output-directory target/windows-word-baselines/word-border-comparisons
      - name: Compare every registered Word version's baselines
        run: cargo test --manifest-path crates/jade-docx-native-render/Cargo.toml --locked --test word_windows_coordinates windows_word_baselines_with_bundled_standins -- --exact
      - name: Compare Windows Word paragraph and script origins with installed Arial
        run: cargo test --manifest-path crates/jade-docx-native-render/Cargo.toml --locked --test word_windows_coordinates windows_word_arial_edge_origins -- --exact
      - name: Preserve spaced table geometry through editing and export
        run: cargo test --manifest-path crates/jade-docx-native-render/Cargo.toml --locked --test word_windows_coordinates spaced_tables_preserve_origins_after_edit_export_and_undo -- --exact
      - name: Upload versioned Windows manual-break and legacy observations
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
