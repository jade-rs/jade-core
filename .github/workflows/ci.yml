name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # 03:00 JST: retain corpus coverage outside the PR feedback loop.
    - cron: '0 18 * * *'
  workflow_dispatch:
    inputs:
      pdf_parity_full:
        description: Compare every PDF fixture across all densities, themes and edit states
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  crdt-worker-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Install pinned Lean toolchain manager
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/elan-crdt"
          cd "$RUNNER_TEMP/elan-crdt"
          curl --fail --location --retry 3 --output elan.tar.gz https://github.com/leanprover/elan/releases/download/v4.2.4/elan-x86_64-unknown-linux-gnu.tar.gz
          echo '42b94d4244e8353142c456ec0e4ca6528fd898a6c604d4059f494e706e431f63  elan.tar.gz' | sha256sum --check
          tar -xzf elan.tar.gz
          ./elan-init -y --default-toolchain none --no-modify-path
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Check capture proofs (pinned by lean-toolchain)
        working-directory: crates/jade-docx-crdt/formal
        run: |
          lean Capture.lean
          lean Session.lean
      - name: Worker PBT against the executable proved model
        env:
          JADE_LEAN_ORACLE: '1'
        run: node --experimental-strip-types --test crates/jade-docx-crdt/worker/*.test.ts

  lint:
    runs-on: ubuntu-latest
    # A stalled dependency install used to burn the full six-hour default.
    timeout-minutes: 45
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Cargo fmt
        run: cargo fmt --all -- --check

      - name: Cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Cargo check
        run: cargo check --all --all-features

      - name: Cargo check the file writers the browser build uses (wasm32)
        # `.doc` and password-protected packages are written in the browser
        # too; their compound-file writer must not need a clock there.
        run: |
          rustup target add wasm32-unknown-unknown
          cargo check --target wasm32-unknown-unknown -p jade-doc-writer -p jade-opc -p jade-xlsx-calc

  test:
    runs-on: ubuntu-latest
    # A stalled dependency install used to burn the full six-hour default.
    timeout-minutes: 45
    env:
      # Keep hundreds of test binaries/link jobs within hosted-runner disk and memory.
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Verify Word oracle release corpus input bytes
        run: python3 -m unittest discover -s scripts -p test_word_oracle_release_corpus.py

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Cargo property tests (headless API)
        run: cargo test -p jade-docx-editor --all-features property_

      - name: Cargo test
        run: |
          cargo test --all --all-features -- \
            --skip text_extract::tests::extracts_expected_first_wrapped_line_from_yokohama_mini \
            --skip text_extract::tests::line_layout_exposes_index_text_page_and_geometry

      - name: Install Node.js for CRDT worker tests
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: CRDT worker capture barriers
        run: node --experimental-strip-types --test crates/jade-docx-crdt/worker/*.test.ts

      - name: Verify native macOS workflow contract
        run: ruby tests/ci/native_macos_workflow_test.rb

      - name: Verify macOS Skia acquisition
        run: python3 -m unittest discover -s scripts/ci -p test_prepare_macos_skia.py

      - name: Verify Word inline-space probe inputs
        run: python3 -m unittest discover -s tests/word-oracle/mac-probes-20261019/generators -p test_object_spaces_probe.py

      - name: Audit edited DOCX fixture corpus
        run: |
          python3 -m unittest discover -s scripts -p test_audit_mac_release_corpus.py
          python3 scripts/audit-mac-release-corpus.py

  # Run the coordinate gate independently: a lint/PDF dependency failure in
  # native-macos must not prevent the Mac coordinate comparison from running.
  word-mac-coordinates:
    name: Mac Word coordinate match
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      RUSTUP_TOOLCHAIN: stable
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/word-mac-coordinates
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: |
            . -> target/word-mac-coordinates
      - name: Prepare verified macOS Skia binaries
        run: python3 scripts/ci/prepare_macos_skia.py --output "$RUNNER_TEMP/jade-skia-0.87.0-macos.tar.gz"
      - name: Compare Mac drawing coordinates with committed Word references
        run: cargo test --manifest-path crates/jade-docx-native-render/Cargo.toml --locked --test word_mac_coordinates -- --test-threads=1
      - name: Upload coordinate differences
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mac-word-coordinate-differences
          path: crates/jade-docx-native-render/target/word-mac-coordinates
          if-no-files-found: ignore

  windows-word-baselines:
    name: Windows Word baselines by version
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/windows-word-baselines
      RUSTUP_TOOLCHAIN: stable
      SKIA_BINARIES_URL: https://github.com/rust-skia/skia-binaries/releases/download/0.87.0/skia-binaries-e551f334ad5cbdf43abf-x86_64-pc-windows-msvc-pdf-svg-textlayout-vulkan-webpd-webpe.tar.gz
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: . -> target/windows-word-baselines
      # No Office installation/font redistribution is required for this
      # vertical-policy check. Full installed-font XY tests run on the Word
      # capture machine via jade-office/scripts/test-windows-word.ps1.
      - name: Setup drawing-reference verifier Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install pinned vector border verifier
        run: python -m pip install -r scripts/word-oracle/requirements-borders.txt
      - name: Verify drawing-origin extraction and rejection cases
        run: python -m unittest discover -s scripts/word-oracle -p test_windows_emf.py
      - name: Reconstruct registered origins from original Word drawing files
        run: python scripts/word-oracle/extract_windows_emf.py --verify-index tests/word-oracle/windows/index.json
      - name: Verify border displacement and missing-paint rejection cases
        run: python -m unittest discover -s scripts/word-oracle -p test_windows_borders.py
      - name: Build vector drawing probe
        run: cargo build --manifest-path crates/jade-docx-native-render/Cargo.toml --locked --example word_coordinates
      - name: Compare Windows table borders with every registered Word version
        run: python scripts/word-oracle/compare_windows_borders.py --index tests/word-oracle/windows/index.json --native-executable target/windows-word-baselines/debug/examples/word_coordinates.exe --output-directory target/windows-word-baselines/word-border-comparisons
      - name: Compare every registered Word version's baselines
        run: cargo test --manifest-path crates/jade-docx-native-render/Cargo.toml --locked --test word_windows_coordinates windows_word_baselines_with_bundled_standins -- --exact
      - name: Compare Windows Word paragraph and script origins with installed Arial
        run: cargo test --manifest-path crates/jade-docx-native-render/Cargo.toml --locked --test word_windows_coordinates windows_word_arial_edge_origins -- --exact
      - name: Preserve spaced table geometry through editing and export
        run: cargo test --manifest-path crates/jade-docx-native-render/Cargo.toml --locked --test word_windows_coordinates spaced_tables_preserve_origins_after_edit_export_and_undo -- --exact
      - name: Upload Windows border differences
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-word-border-differences
          path: target/windows-word-baselines/word-border-comparisons
          if-no-files-found: ignore

  windows-native-editing:
    name: Windows native editing and font reuse
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/windows-native-editing
      RUSTUP_TOOLCHAIN: stable
      SKIA_BINARIES_URL: https://github.com/rust-skia/skia-binaries/releases/download/0.87.0/skia-binaries-e551f334ad5cbdf43abf-x86_64-pc-windows-msvc-pdf-svg-textlayout-vulkan-webpd-webpe.tar.gz
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: . -> target/windows-native-editing
      - name: Verify Windows font reuse and rendering
        run: |
          cargo clippy --manifest-path crates/jade-skia-painter/Cargo.toml --locked --lib --test windows_font_reuse -- -D warnings
          cargo test --manifest-path crates/jade-skia-painter/Cargo.toml --locked --test windows_font_reuse --test font_styles --test opentype_features -- --test-threads=1
      - name: Verify Windows native editing histories
        run: cargo test --manifest-path crates/jade-docx-native-render/Cargo.toml --locked --test native_document --test tables --test typing_differential -- --test-threads=1

  native-macos:
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/native-macos
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: |
            . -> target/native-macos
      - name: Prepare verified macOS Skia binaries
        run: python3 scripts/ci/prepare_macos_skia.py --output "$RUNNER_TEMP/jade-skia-0.87.0-macos.tar.gz"

      - name: Cargo check native crates
        run: |
          cargo check --manifest-path crates/jade-skia-painter/Cargo.toml --all-targets --locked
          cargo check --manifest-path crates/jade-docx-native-render/Cargo.toml --all-targets --locked
          cargo check --manifest-path crates/jade-xlsx-native-render/Cargo.toml --all-targets --locked

      - name: Cargo clippy native crates
        run: |
          cargo clippy --manifest-path crates/jade-skia-painter/Cargo.toml --all-targets --locked -- -D warnings
          cargo clippy --manifest-path crates/jade-docx-native-render/Cargo.toml --all-targets --locked -- -D warnings
          cargo clippy --manifest-path crates/jade-xlsx-native-render/Cargo.toml --all-targets --locked -- -D warnings

      - name: Install PDF rasterizer
        run: |
          brew install poppler
          swiftc tests/pdf/render_coregraphics.swift -o "$RUNNER_TEMP/render-coregraphics"
          echo "JADE_PDF_COREGRAPHICS=$RUNNER_TEMP/render-coregraphics" >> "$GITHUB_ENV"

      - name: Setup native PDF comparison Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tests/pdf/requirements.txt

      - name: Install native PDF comparison dependencies
        run: python -m pip install -r tests/pdf/requirements.txt

      - name: Verify unadjusted Word for Mac probe coordinates
        run: cargo test --manifest-path crates/jade-docx-native-render/Cargo.toml --locked --test word_mac_coordinates -- --test-threads=1

      - name: Verify native PDF structure and representative rendering
        env:
          JADE_PDFTOPPM: pdftoppm
          JADE_PDFTOTEXT: pdftotext
          FULL_PDF_CORPUS: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.pdf_parity_full) }}
        run: |
          cargo fmt --manifest-path crates/jade-skia-painter/Cargo.toml -- --check
          cargo fmt --manifest-path crates/jade-docx-native-render/Cargo.toml -- --check
          cargo test --manifest-path crates/jade-skia-painter/Cargo.toml --locked -- --include-ignored
          # Timing checks must not compete with the other render tests.
          cargo test --manifest-path crates/jade-docx-native-render/Cargo.toml --locked -- --test-threads=1
          if [[ "$FULL_PDF_CORPUS" == "true" ]]; then
            JADE_PDF_CORPUS_ALL=1 cargo test --manifest-path crates/jade-docx-native-render/Cargo.toml --locked --test pdf_export -- --ignored
          else
            cargo test --manifest-path crates/jade-docx-native-render/Cargo.toml --locked --test pdf_export -- --ignored --skip edited_corpus_documents_keep_live_pixels_after_undo_and_redo
          fi
          python tests/pdf/native_reader_parity.py crates/jade-docx-native-render/target/pdf-parity --readers poppler pdfium coregraphics

      - name: Upload native PDF differences
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-pdf-parity
          path: |
            crates/jade-docx-native-render/target/pdf-parity
            crates/jade-docx-native-render/target/pdf-text-parity
            crates/jade-docx-native-render/target/word-mac-coordinates
          if-no-files-found: ignore

  xlsx-native:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/xlsx-native
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: |
            . -> target/xlsx-native
      - name: Prepare verified macOS Skia binaries
        run: python3 scripts/ci/prepare_macos_skia.py --output "$RUNNER_TEMP/jade-skia-0.87.0-macos.tar.gz"
      - name: Verify the vendored formula engine
        run: |
          cargo fmt --manifest-path third_party/ironcalc-base/Cargo.toml -- --check
          cargo test --manifest-path third_party/ironcalc-base/Cargo.toml --locked --lib
          cargo clippy --manifest-path third_party/ironcalc-base/Cargo.toml --locked --lib -- -D warnings
      - name: Verify native SDK formatting and rendering
        run: |
          cargo fmt --manifest-path crates/jade-xlsx-native-render/Cargo.toml -- --check
          cargo test --manifest-path crates/jade-xlsx-native-render/Cargo.toml --locked
          cargo clippy --manifest-path crates/jade-xlsx-native-render/Cargo.toml --locked --all-targets -- -D warnings
      - name: Verify shared SVG source rectangles and opacity
        run: |
          cargo test --manifest-path crates/jade-skia-painter/Cargo.toml --locked --test svg_image --test image_opacity
          cargo clippy --manifest-path crates/jade-skia-painter/Cargo.toml --locked --test image_opacity -- -D warnings
